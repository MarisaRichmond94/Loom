<svg width="308" height="282" viewBox="186 192 308 282" xmlns="http://www.w3.org/2000/svg">
  <title>Loom network logo</title>
  <desc>A modern logo showing interconnected story nodes in a network pattern</desc>

  <style>
    @media (prefers-color-scheme: light) {
      .connection { stroke: #E0E7FF; stroke-width: 12; }
      .node-large { fill: #6366F1; }
      .node-medium { fill: #8B5CF6; }
      .node-small { fill: #A855F7; }
    }
    @media (prefers-color-scheme: dark) {
      .connection { stroke: #3730A3; stroke-width: 12; }
      .node-large { fill: #818CF8; }
      .node-medium { fill: #A78BFA; }
      .node-small { fill: #C084FC; }
    }
  </style>

  <!-- Connections -->
  <line class="connection" x1="340" y1="240" x2="260" y2="320"/>
  <line class="connection" x1="340" y1="240" x2="340" y2="340"/>
  <line class="connection" x1="340" y1="240" x2="420" y2="320"/>
  <line class="connection" x1="260" y1="320" x2="220" y2="420"/>
  <line class="connection" x1="260" y1="320" x2="300" y2="420"/>
  <line class="connection" x1="340" y1="340" x2="340" y2="440"/>
  <line class="connection" x1="420" y1="320" x2="380" y2="420"/>
  <line class="connection" x1="420" y1="320" x2="460" y2="420"/>

  <!-- Nodes -->
  <circle class="node-large" cx="340" cy="240" r="32"/>
  <circle class="node-medium" cx="260" cy="320" r="24"/>
  <circle class="node-medium" cx="340" cy="340" r="24"/>
  <circle class="node-medium" cx="420" cy="320" r="24"/>
  <circle class="node-small" cx="220" cy="420" r="18"/>
  <circle class="node-small" cx="300" cy="420" r="18"/>
  <circle class="node-small" cx="340" cy="440" r="18"/>
  <circle class="node-small" cx="380" cy="420" r="18"/>
  <circle class="node-small" cx="460" cy="420" r="18"/>
</svg>
